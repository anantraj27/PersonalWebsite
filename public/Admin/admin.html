<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sign In</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
        />
        <style></style>
    </head>

    <body>
        <form action="/signin" target="_blank" method="POST">
            <label>Email address</label><br />
            <input class="user userEmail" type="text" name="Email" required />
            <p id="emailMessage"></p>

            <label>Enter your password</label><br />
            <input class="user userPassword" type="password" name="password" required />
            <p id="passwordMessage"></p>

            <button type="submit" class="verification">Sign in</button>

            <br /><br />

            <div style="display: flex; align-items: center">
                <hr style="flex: 1; border: none; border-top: 1px solid white; margin: 0" />
                <span style="margin: 0 10px">or</span>
                <hr style="flex: 1; border: none; border-top: 1px solid white; margin: 0" />
            </div>
        </form>

        <script src="./index1.js"></script>
    </body>
</html>
