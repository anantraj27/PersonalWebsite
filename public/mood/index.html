<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

    <title>Document</title>
    <link rel="stylesheet" href="/mood/style.css">




</head>

<body>
    <div id="heart-layer"></div>

    <!-- LIST SCREEEEN   .........       -->
    <div class="listScreen">
        <nav>
            <div class="left">
                <div class="threeLine"> ≡</div>
                <div class="notepad"> Notepad</div>
            </div>
            <div class="right">
                <div class="newnotes"> ➕ </div>
                <div class="search">🔍</div>
                <div class="threeDot">⋮</div>

            </div>

        </nav>

        <header class="titleList">




        </header>
    </div>

    <!-- Editor Screen ........... -->

    <div class="editorScreen" style="display: none;">
        <nav>
            <div class="left">
                <div class="backArrow"> ⬅️ </div>
                <div class="notepad"> Notepad</div>
            </div>
            <div class="right">
               
           
                <div class="save"><span>save 💾</span></div>
                 <div class="textStyle"><span>︙</span></div>


            </div>
        </nav>
        <section class="editorSection">

            <header>
                <input placeholder="Enter title" type="text" class="editorTitle">
            </header>
            <hr>
            <div class="extra">


                <div class="choose1"><span class="label1">Choose Category :</span>  <span class="arrow">⌄</span>
                    <div class="category">

                        <div class="study">📘 study</div>
                        <div class="personal">🧑‍🦱 Personal</div>
                        <div class="idea">💡 Idea</div>

                    </div>

                </div>



                <div class="choose2"><span class="label">Choose mood :</span> <span class="arrow">⌄</span>
                    <div class="mood">


                        <div class="happy">😊 Happy</div>
                        <div class="motivated">🔥 Motivated</div>
                        <div class="normal">🙂 Normal</div>
                        <div  class="romantic">❤️ Romantic </div>

                    </div>


                </div>

            </div>
           <div class="fonts">🖌️</div>

            <textarea virtualkeyboardpolicy="manual" placeholder="Write notes ✏️.." class="editorText">     </textarea>
            

        </section>

    </div>


</body>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/mood/index.js"></script>



</html>
