<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
        <!--
Source - https://stackoverflow.com/a/79200131
Posted by yurenchen, modified by community. See post 'Timeline' for change history
Retrieved 2026-02-25, License - CC BY-SA 4.0
-->

        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
        />

        <title>Document</title>
        <link rel="stylesheet" href="/mood/style.css" />
    </head>

    <body>
        <div id="heart-layer"></div>

        <nav class="original">
            <div class="left">
                <div class="threeLine">≡</div>
                <div class="notepad">Notepad</div>
            </div>
            <div class="right">
                <div class="newnotes">➕</div>
                <div class="search">🔍</div>
                <div class="threeDot">⋮</div>
            </div>
        </nav>
        <nav class="searchNav hidden">
            <div class="inputContainer">
                <input class="inputSearch" name="search" placeholder="🔍 Search Notes .." />
                <div class="cross">❌</div>
            </div>
        </nav>
        <!-- LIST SCREEEEN   .........       -->
        <div class="searchTitleList hidden"></div>
        <div class="listScreen">
            <div class="titleList">
                <button id="loadMore">
                    <span class="text">Load More</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </div>

        <!-- Editor Screen ........... -->

        <div class="editorScreen" style="display: none">
            <nav class="original">
                <div class="left">
                    <div class="backArrow">⬅️</div>
                    <div class="notepad">Notepad</div>
                </div>
                <div class="right">
                    <button class="save">save 💾</button>
                    <div class="textStyle"><span>︙</span></div>
                </div>
            </nav>
            <section class="editorSection">
                <header>
                    <div contenteditable="true" class="editorTitle" data-title="New Notes"> </div>
                </header>
               
                <div class="extra">
                    <div class="choose1">
                        <span class="label1">Choose Category :</span>
                        <span class="arrow">⌄</span>
                        <div class="category">
                            <div class="study">📘 study</div>
                            <div class="personal">🧑‍🦱 Personal</div>
                            <div class="idea">💡 Idea</div>
                        </div>
                    </div>

                    <div class="choose2">
                        <span class="label">Choose mood :</span>
                        <span class="arrow">⌄</span>
                        <div class="mood">
                            <div class="happy">😊 Happy</div>
                            <div class="motivated">🔥 Motivated</div>
                            <div class="normal">🙂 Normal</div>
                            <div class="romantic">❤️ Romantic</div>
                        </div>
                    </div>
                </div>
                <div class="fonts">
                    🖌️

                    <div class="color hidden">
                        <button data-color="white"></button>
                        <button data-color="orange"></button>
                        <button data-color="red"></button>
                        <button data-color="green"></button>
                        <button data-color="blue"></button>
                        <button data-color="yellow"></button>
                    </div>
                    <div class="headings">

                    </div>
                </div>

                <div contenteditable="true" data-text="enter text ✏️...." class="editorText"> </div>
            </section>
        </div>
    </body>

    <script type="module" src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="/mood/index.js"></script>
</html>
